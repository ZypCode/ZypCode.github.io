<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ZypCode 的个人项目与博客导航">
  <title>ZypCode · 项目导航</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #141d2f;
      --line: #27354f;
      --fg: #e8eefc;
      --dim: #93a3c0;
      --accent: #4c8dff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 2rem 1rem 3rem;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 0.35rem; letter-spacing: 0.02em; }
    .sub { color: var(--dim); font-size: 0.92rem; margin-bottom: 2rem; }
    .grid { display: grid; gap: 1rem; }
    @media (min-width: 540px) { .grid { grid-template-columns: 1fr 1fr; } }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.15rem 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.1s;
    }
    a.card:hover { border-color: var(--accent); }
    a.card:active { transform: scale(0.99); }
    .card h2 { margin: 0 0 0.4rem; font-size: 1.05rem; color: var(--fg); }
    .card p { margin: 0; font-size: 0.88rem; color: var(--dim); }
    .tag {
      display: inline-block;
      margin-top: 0.65rem;
      font-size: 0.75rem;
      color: var(--accent);
    }
    footer { margin-top: 2.5rem; font-size: 0.8rem; color: var(--dim); text-align: center; }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ZypCode</h1>
    <p class="sub">做一个不断进步的 Coder · 项目与博客入口</p>
    <div class="grid">
      <a class="card" href="/yu-peng-stack/">
        <h2>YuPeng 小栈</h2>
        <p>技术笔记与随笔：安全、Linux、开发环境与实践记录。</p>
        <span class="tag">博客 → /yu-peng-stack/</span>
      </a>
      <a class="card" href="/score-planner/">
        <h2>分数最优推进</h2>
        <p>关卡分数分配计算器：总溢出最小的推进方案（PWA，可装到手机）。</p>
        <span class="tag">工具 → /score-planner/</span>
      </a>
      <a class="card" href="/emitter-calculator/">
        <h2>发射器库存计算器</h2>
        <p>多种类发射器 2 合 1 合成、占用格数统计，关卡奖励与云同步存档。</p>
        <span class="tag">工具 → /emitter-calculator/</span>
      </a>
    </div>
    <footer>
      <a href="https://github.com/ZypCode" rel="noopener noreferrer">GitHub</a>
    </footer>
  </div>
</body>
</html>
